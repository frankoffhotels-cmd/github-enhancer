<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Enhancer</title>
  <style>
    body {
      min-width: 200px;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #333;
    }
    .container {
      max-width: 400px;
    }
    h3 {
      margin-top: 0;
      font-size: 16px;
      color: #24292e;
    }
    p {
      font-size: 14px;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-block;
      padding: 6px 12px;
      background: #24292e;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn:hover {
      background: #303641;
    }
    .footer {
      margin-top: 12px;
      font-size: 12px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>GitHub Enhancer</h3>
    <p>Extension that adds Copy and Download buttons to GitHub.</p>
    <button class="btn" id="closeBtn">Close</button>
  </div>
  <div class="footer">
    Version 1.0
  </div>
</body>
</html>
